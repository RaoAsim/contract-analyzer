<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Offline · Contract Analyzer</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fafaf9; color: #1c1917; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 22rem; padding: 1.5rem; text-align: center; }
      .tile { width: 3rem; height: 3rem; margin: 0 auto 1rem; border-radius: 0.75rem; background: #0f766e; }
      h1 { font-size: 1.125rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.25rem; color: #57534e; font-size: 0.9rem; line-height: 1.5; }
      button { border: 0; border-radius: 0.5rem; background: #0f766e; color: #fff; font: inherit; font-size: 0.9rem; padding: 0.55rem 1rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="tile" aria-hidden="true"></div>
      <h1>You're offline</h1>
      <p>Contract Analyzer needs a connection to read your documents and answer questions. Your chats are saved and will be here when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
